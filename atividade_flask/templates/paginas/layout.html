<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default('Titulo da Página') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body class="bg-dark d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-dark shadow-sm border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">
                <i class="bi bi-flask me-2"></i>Flask - Rotas
            </a>
            <span class="navbar-text text-secondary small d-none d-md-inline">Teste de endpoints</span>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark border-top border-secondary py-3 mt-auto">
        <div class="container text-center text-secondary small">Rotas Flask</div>
    </footer>

    <div id="toastArea" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function badgeClass(status) {
            if (status >= 200 && status < 300) return 'success';
            if (status >= 400 && status < 500) return 'warning';
            if (status >= 500) return 'danger';
            return 'secondary';
        }

        function showResult(status, body) {
            var panel = document.getElementById('apiResult');
            var badge = document.getElementById('apiStatus');
            var pre = document.getElementById('apiBody');
            panel.classList.remove('d-none', 'alert-success', 'alert-warning', 'alert-danger', 'alert-secondary');
            var cls = status >= 200 && status < 300 ? 'success' : (status >= 400 ? (status >= 500 ? 'danger' : 'warning') : 'secondary');
            panel.classList.add('alert-' + cls);
            badge.className = 'badge bg-' + badgeClass(status) + ' method-badge';
            badge.textContent = status;
            try {
                var json = JSON.parse(body);
                pre.textContent = JSON.stringify(json, null, 2);
            } catch (e) {
                pre.textContent = body || '(sem conteúdo)';
            }
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function apiGet(url) {
            return fetch(url).then(function (r) {
                return r.text().then(function (t) {
                    showResult(r.status, t);
                    return r;
                });
            });
        }

        function apiPost(url, body, headers) {
            return fetch(url, {
                method: 'POST',
                headers: headers || {},
                body: body
            }).then(function (r) {
                return r.text().then(function (t) {
                    showResult(r.status, t);
                    return r;
                });
            });
        }
    </script>
    {% block javascript %}{% endblock %}
</body>
</html>
